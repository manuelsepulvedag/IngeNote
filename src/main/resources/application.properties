spring.application.name=ingenote

# Configure DB_URL, DB_USERNAME, DB_PASSWORD y JWT_SECRET en el entorno desplegado.
spring.datasource.url=${DB_URL}
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de JPA/Hibernate
# 'validate' asegura que Spring verifique que las tablas existen, pero no intente crearlas ni modificarlas
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

app.jwt.secret=${JWT_SECRET:cambie-esta-clave-de-desarrollo-por-una-de-32-bytes}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}
