spring.application.name=ingenote

# Configure DB_URL, DB_USERNAME, DB_PASSWORD y JWT_SECRET en el entorno desplegado.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de JPA/Hibernate
# 'validate' asegura que Spring verifique que las tablas existen, pero no intente crearlas ni modificarlas
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

app.jwt.secret=${JWT_SECRET:cambie-esta-clave-de-desarrollo-por-una-de-32-bytes}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}

# Límites para subida de archivos académicos (por defecto Spring solo permite 1MB)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# Configuración de Supabase Storage
supabase.url=${SUPABASE_URL:}
supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:}
supabase.storage.bucket=${SUPABASE_STORAGE_BUCKET:recursos-academicos}

server.port=${PORT:8080}